<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">智能客服 Agent · 系统架构</title>
  <desc id="desc">单机双进程架构。FastAPI 请求经 Harness 进入 LangGraph，调用一次模型选择受控动作；动作进入知识检索、商品推荐偏好或业务工具。退款必须经用户确认和后端幂等提交。统一 Trace 支持隔离评测和回归。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17283c; }
      .mono { font-family: Consolas, "SFMono-Regular", monospace; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2.6px; fill: #35597b; }
      .title { font-size: 47px; font-weight: 700; letter-spacing: -.75px; }
      .subtitle { font-size: 22px; fill: #435a72; }
      .section { font-size: 17px; font-weight: 700; fill: #35597b; }
      .label { font-size: 16px; font-weight: 700; fill: #3b5976; }
      .component { font-size: 24px; font-weight: 700; }
      .copy { font-size: 18px; fill: #415871; }
      .caption { font-size: 15px; fill: #445b71; }
      .card-title { font-size: 28px; font-weight: 700; }
      .detail { font-size: 18px; font-weight: 700; }
      .resource-title { font-size: 17px; font-weight: 700; }
      .white { fill: #f3f8ff; }
      .faint-white { fill: #c9d9e9; }
      .flow { fill: none; stroke: #4e708f; stroke-width: 2; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #4e708f; stroke-width: 2; }
      .dependency { fill: none; stroke: #a1b3c3; stroke-width: 2; stroke-dasharray: 3 4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4e708f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f4f7fb"/>
  <rect width="1600" height="6" fill="#173857"/>
  <text x="64" y="57" class="eyebrow">SYSTEM ARCHITECTURE</text>
  <text x="62" y="112" class="title">智能客服 Agent · 系统架构</text>
  <text x="64" y="154" class="subtitle">一次模型决策，后端校验执行，全链路可回归验证</text>
  <rect x="1219" y="55" width="317" height="65" rx="11" fill="#e8eff6"/>
  <text x="1241" y="82" class="label">单机双进程</text>
  <text x="1241" y="105" class="caption mono">FastAPI + FastMCP (loopback)</text>
  <line x1="64" y1="176" x2="1536" y2="176" stroke="#c8d7e5"/>

  <text x="64" y="204" class="section">01  在线请求</text>
  <path d="M312 278H340" class="flow"/>
  <path d="M664 278H692" class="flow"/>
  <path d="M1072 278H1100" class="flow"/>
  <rect x="64" y="221" width="248" height="115" rx="11" fill="#fff" stroke="#c4d4e3"/>
  <text x="83" y="249" class="label">客户端 / Swagger</text>
  <text x="83" y="281" class="component mono">FastAPI</text>
  <text x="83" y="308" class="copy">Bearer 认证 · REST / SSE</text>

  <rect x="344" y="221" width="320" height="115" rx="11" fill="#fff" stroke="#c4d4e3"/>
  <text x="364" y="249" class="label">运行约束</text>
  <text x="364" y="281" class="component mono">Harness</text>
  <text x="364" y="308" class="copy">上下文组装 · 超时 · 请求幂等</text>

  <rect x="696" y="221" width="376" height="115" rx="11" fill="#173857"/>
  <text x="717" y="249" class="label faint-white">单 Agent · LangGraph 决策节点</text>
  <text x="717" y="281" class="component mono white">next_action</text>
  <text x="717" y="308" class="copy white">Model Gateway → OpenAI 兼容模型</text>

  <rect x="1104" y="221" width="432" height="115" rx="11" fill="#fff" stroke="#c4d4e3"/>
  <text x="1125" y="249" class="label">确定性执行节点</text>
  <text x="1125" y="281" class="component mono">execute_action</text>
  <text x="1125" y="308" class="copy">解析订单指代 · 匹配 Skill · 按动作调用</text>

  <path d="M1296 337V373H304" class="branch"/>
  <path d="M304 373V407" class="flow"/>
  <path d="M800 373V407" class="flow"/>
  <path d="M1296 373V407" class="flow"/>
  <text x="64" y="391" class="section">02  执行分支</text>

  <rect x="64" y="412" width="480" height="240" rx="12" fill="#fff" stroke="#c4d4e3"/>
  <rect x="84" y="433" width="46" height="26" rx="5" fill="#e5effb"/>
  <text x="107" y="452" class="label mono" text-anchor="middle" fill="#26598c">RAG</text>
  <text x="84" y="494" class="card-title">企业知识检索</text>
  <text x="84" y="522" class="copy">退换政策、保修、产品知识</text>
  <line x1="84" y1="542" x2="524" y2="542" stroke="#d6e1eb"/>
  <text x="84" y="574" class="detail">向量检索 + BM25 → RRF → 重排</text>
  <text x="84" y="605" class="copy">基于检索证据生成带引用的回答</text>

  <rect x="560" y="412" width="480" height="240" rx="12" fill="#fff" stroke="#c4d4e3"/>
  <rect x="580" y="433" width="83" height="26" rx="5" fill="#e0f1ec"/>
  <text x="621" y="452" class="label mono" text-anchor="middle" style="fill:#266555">MEMORY</text>
  <text x="580" y="494" class="card-title">跨会话长期记忆</text>
  <text x="580" y="522" class="copy">只提供偏好参考，不作为业务依据</text>
  <line x1="580" y1="542" x2="1020" y2="542" stroke="#d6e1eb"/>
  <text x="580" y="574" class="detail">推荐时召回 → SQLite 校验归属与版本</text>
  <text x="580" y="605" class="copy">授权后：规则筛选 → 异步批量提取</text>

  <rect x="1056" y="412" width="480" height="240" rx="12" fill="#fff" stroke="#c4d4e3"/>
  <rect x="1076" y="433" width="74" height="26" rx="5" fill="#fff0dc"/>
  <text x="1113" y="452" class="label mono" text-anchor="middle" style="fill:#7a511d">TOOLS</text>
  <text x="1076" y="494" class="card-title">受控业务工具</text>
  <text x="1076" y="522" class="copy">订单、物流、实时商品、退款</text>
  <line x1="1076" y1="542" x2="1516" y2="542" stroke="#d6e1eb"/>
  <text x="1076" y="574" class="detail mono">Policy Guard → FastMCP → Business</text>
  <text x="1076" y="605" class="copy">退款：核查资格 → 用户确认 → 幂等提交</text>

  <path d="M304 652V675 M800 652V675 M1296 652V675" class="dependency"/>
  <rect x="64" y="675" width="976" height="68" rx="10" fill="#e8eff6"/>
  <text x="84" y="701" class="resource-title">共享本地检索底座</text>
  <text x="84" y="726" class="copy">BGE-M3 · BGE Reranker（记忆可选） · Chroma（知识与记忆使用不同集合）</text>
  <rect x="1056" y="675" width="480" height="68" rx="10" fill="#e8eff6"/>
  <text x="1076" y="701" class="resource-title">SQLite：业务记录与图检查点分离</text>
  <text x="1076" y="726" class="caption">业务 / 记忆的权威数据 ≠ LangGraph 执行进度</text>

  <rect x="64" y="771" width="1472" height="82" rx="12" fill="#173857"/>
  <text x="87" y="804" class="label faint-white">03  观测与评测</text>
  <text x="87" y="832" class="component mono white">Trace → Evaluation</text>
  <line x1="380" y1="792" x2="380" y2="832" stroke="#64819b"/>
  <text x="404" y="805" class="copy white">记录动作、工具、引用与业务终态</text>
  <text x="404" y="832" class="caption faint-white">隔离数据复跑 · 安全断言 · 版本对比</text>
  <line x1="1023" y1="792" x2="1023" y2="832" stroke="#64819b"/>
  <text x="1047" y="805" class="copy white" style="font-weight:700">34 → 17 次模型请求</text>
  <text x="1047" y="832" class="caption faint-white">固定的工作流 + 安全用例（真实模型，14/14 通过）</text>
</svg>
